name: containers
on: deployment
jobs:
  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: df
        uses: ./.github/actions/dockerfile
        with:
          who: docker
      - run: echo "dockerfile output ${{ steps.df.outputs.said }}"
      - uses: ./.github/actions/dockerfile
        with:
          who: docker
          args: overridden
      - uses: ./.github/actions/bare
      - uses: docker://debian:12-slim
        with:
          entrypoint: /bin/sh
          args: -c "echo image step sees $INPUT_COLOR in $PWD"
          color: blue
      - shell: bash
        run: |
          u="${ACTIONS_CACHE_URL#http://}"; hp="${u%%/*}"; base="/${u#*/}"
          exec 3<>"/dev/tcp/${hp%:*}/${hp#*:}"
          printf 'GET %s_apis/artifactcache/cache?keys=x&version=v HTTP/1.1\r\nHost: %s\r\nConnection: close\r\n\r\n' "$base" "$hp" >&3
          echo "cache server from container: $(head -1 <&3 | tr -d '\r')"
      - run: echo "toolcache=[$RUNNER_TOOL_CACHE] lang=[$LANG] imageos=[$ImageOS]" && touch "$RUNNER_TOOL_CACHE/.written"
      # A GITHUB_PATH addition must not cost the env names dash cannot
      # export, such as an action's INPUT_GO-VERSION.
      - run: echo /opt/added >> "$GITHUB_PATH"
      - shell: bash
        env:
          DASHED-NAME: kept
        run: echo "path=[${PATH%%:*}] dashed=[$(printenv DASHED-NAME)]"
      # A working directory the job has not made yet, below the workspace,
      # which is a volume on Docker Desktop.
      - working-directory: build/out
        run: echo "made below the $(basename "$(dirname "$(dirname "$PWD")")")" > made.txt && cat made.txt
  services:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 25432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
      # `entrypoint` and `command` replace the image's: postgres listens on 6543.
      db2:
        image: pgvector/pgvector:pg16
        entrypoint: docker-entrypoint.sh
        command: postgres -p 6543
        env:
          POSTGRES_PASSWORD: pw
        ports:
          - 25433:6543
        options: --health-cmd "pg_isready -p 6543" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      # As on a GitHub runner VM: the published port on localhost (Docker), or the
      # service name where the job cannot share the host network (Apple). A fixed
      # host port, because Docker Desktop does not route random ones to host-network
      # containers.
      - shell: bash
        run: |
          { echo > /dev/tcp/localhost/${{ job.services.db.ports['5432'] }}; } 2>/dev/null || echo > /dev/tcp/db/5432
          echo "service db reachable, published as ${{ job.services.db.ports['5432'] != '' }}"
          { echo > /dev/tcp/localhost/25433; } 2>/dev/null || echo > /dev/tcp/db2/6543
          echo "service db2 runs its command"
