name: release

# Pushing a tag vX.Y.Z (matching Cargo.toml's version) builds the binaries,
# publishes them as a GitHub release and updates the Homebrew formula in
# simota/homebrew-tap (needs the HOMEBREW_TAP_TOKEN secret: a token that can
# push to that repository).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          archive="runthrough-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz"
          mkdir dist
          tar -czf "dist/$archive" -C target/${{ matrix.target }}/release runthrough -C "$GITHUB_WORKSPACE" README.md LICENSE
          (cd dist && shasum -a 256 "$archive" > "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the formula in simota/homebrew-tap was not updated"
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/simota/homebrew-tap.git" tap
          mkdir -p tap/Formula
          python3 -I scripts/homebrew_formula.py "${GITHUB_REF_NAME#v}" dist > tap/Formula/runthrough.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/runthrough.rb
          git commit -m "runthrough ${GITHUB_REF_NAME#v}"
          git push
