[package]
name = "runthrough"
version = "0.1.0"
edition = "2021"
description = "Run GitHub Actions workflows locally"
license = "MIT"
repository = "https://github.com/simota/runthrough"

[[bin]]
name = "runthrough"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
glob = "0.3.3"
hex = "0.4.3"
indexmap = { version = "2.14.0", features = ["serde"] }
regex = "1.12.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.27.0"
walkdir = "2.5.0"
